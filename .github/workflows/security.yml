name: Security

# Static analysis and dependency checks, kept apart from ci.yml so that an advisory published
# overnight against an unchanged dependency marks pull requests red without holding a release
# that is already tested. docs/security.md says what each job looks for and what to do when one
# fails.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Mondays, so new advisories and CodeQL queries reach code nobody has touched lately.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # C# is read from source (build-mode none), so the job needs no .NET SDK or database.
        # The web app's TypeScript and the workflows themselves need no build either.
        language: [csharp, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          # The default queries plus the extended security set, which adds checks such as
          # missing rate limits and weaker cookie settings.
          queries: security-extended
          config: |
            paths-ignore:
              - web/node_modules
              - "**/bin"
              - "**/obj"
              - "**/Migrations"
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          category: /language:${{ matrix.language }}

  # A pull request that adds or upgrades to a dependency with a known high or critical advisory
  # fails here, for npm, NuGet, Actions and Docker alike, from GitHub's dependency graph.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  # Both images as a release builds them: OS packages, the .NET runtime, nginx and the shipped
  # packages, checked by Grype for high or critical advisories that have a fix. Results also go to
  # the Security tab; an advisory with no fix yet is listed there without failing.
  image:
    name: Image scan (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: src/Wheelhouse.Api/Dockerfile
          - name: web
            dockerfile: web/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          tags: wheelhouse-${{ matrix.name }}:scan
          cache-from: type=gha,scope=${{ matrix.name }}
      - id: scan
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: wheelhouse-${{ matrix.name }}:scan
          severity-cutoff: high
          only-fixed: true
          output-format: sarif
      - if: ${{ !cancelled() && steps.scan.outputs.sarif != '' }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          category: image-${{ matrix.name }}

  # The dependencies already in the lock files, checked against today's advisories.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - name: NuGet packages, direct and transitive
        run: |
          dotnet restore
          dotnet list package --vulnerable --include-transitive --format json > "$RUNNER_TEMP/nuget.json"
          found=$(jq '[.. | objects | select(has("vulnerabilities")) | .id as $id | .resolvedVersion as $v
            | .vulnerabilities[] | select(.severity == "High" or .severity == "Critical")
            | "\($id) \($v): \(.severity) \(.advisoryurl)"] | unique' "$RUNNER_TEMP/nuget.json")
          if [ "$(jq length <<< "$found")" -gt 0 ]; then
            echo "NuGet packages with high or critical advisories:"
            jq -r '.[]' <<< "$found"
            exit 1
          fi
          echo "No NuGet package has a high or critical advisory."
      - name: npm packages the app ships
        working-directory: web
        # Development tools (the build, test runners) never reach a browser, so only the
        # packages bundled into the app can fail this.
        run: npm audit --omit=dev --audit-level=high
