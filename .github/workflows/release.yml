name: Release

# Every merge to main is tested and, unless held, released: the next version is tagged, its
# images are published, the demo moves to it and is checked, and only then the family instances.
# Pushing a tag such as v0.7.0, or running this by hand with a version, releases that version.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'New release version, for example v0.2.0'
        required: true
        type: string

permissions:
  contents: read

# Releases run one at a time. A merge that arrives while one runs waits; if another arrives
# too, only the newest waits, and its release includes both.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  prepare:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: read
    outputs:
      release: ${{ steps.release.outputs.release }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Choose and pin the release
        id: release
        uses: actions/github-script@v9
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          AUTO_RELEASE: ${{ vars.AUTO_RELEASE }}
        with:
          script: |
            const manual = context.eventName === 'workflow_dispatch';
            const automatic = context.eventName === 'push' && context.ref === 'refs/heads/main';
            if (manual && context.ref !== 'refs/heads/main') {
              throw new Error('Manual releases must run from main.');
            }

            const hold = async (reason) => {
              core.setOutput('release', 'false');
              core.notice(reason);
              await core.summary
                .addHeading('No release')
                .addRaw(reason)
                .write();
            };

            // An automatic release bumps the patch number, or the minor or major number when a
            // pull request merged since the last release carries the release:minor or
            // release:major label.
            const nextVersion = async () => {
              if ((process.env.AUTO_RELEASE || '').trim().toLowerCase() === 'off') {
                await hold('Automatic releases are paused: the repository variable AUTO_RELEASE is off.');
                return null;
              }
              const pullsOf = async (sha) => {
                const { data } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                  ...context.repo, commit_sha: sha
                });
                return data.filter((pull) => pull.merged_at && pull.base.ref === 'main');
              };
              const labelsOf = (pulls) => pulls.flatMap((pull) => pull.labels.map((label) => label.name));
              const message = context.payload.head_commit?.message ?? '';
              if (/\[no release\]/i.test(message) || labelsOf(await pullsOf(context.sha)).includes('release:hold')) {
                await hold('This merge is held: its pull request has the release:hold label or its commit says [no release]. The next release will include it.');
                return null;
              }

              const tags = await github.paginate(github.rest.repos.listTags, { ...context.repo, per_page: 100 });
              const released = tags
                .map((tag) => ({ tag, parts: /^v(\d+)\.(\d+)\.(\d+)$/.exec(tag.name)?.slice(1).map(Number) }))
                .filter((entry) => entry.parts)
                .sort((a, b) => b.parts[0] - a.parts[0] || b.parts[1] - a.parts[1] || b.parts[2] - a.parts[2]);
              if (!released.length) throw new Error('Release the first version by hand.');
              const latest = released[0];
              const { data: comparison } = await github.rest.repos.compareCommitsWithBasehead({
                ...context.repo, basehead: `${latest.tag.commit.sha}...${context.sha}`
              });
              // Re-running all of a release's jobs deploys its version again.
              if (comparison.status === 'identical') return latest.tag.name;
              if (comparison.status === 'behind') {
                await hold(`${latest.tag.name} already includes this commit.`);
                return null;
              }

              const labels = new Set();
              for (const commit of comparison.commits) {
                for (const label of labelsOf(await pullsOf(commit.sha))) labels.add(label);
              }
              let [major, minor, patch] = latest.parts;
              if (labels.has('release:major')) [major, minor, patch] = [major + 1, 0, 0];
              else if (labels.has('release:minor')) [minor, patch] = [minor + 1, 0];
              else patch += 1;
              return `v${major}.${minor}.${patch}`;
            };

            const version = manual
              ? process.env.REQUESTED_VERSION
              : automatic
                ? await nextVersion()
                : context.ref.replace('refs/tags/', '');
            if (!version) return;
            if (!/^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$/.test(version)) {
              throw new Error('Use a release version such as v0.2.0.');
            }
            if (manual || automatic) {
              let existing;
              try {
                existing = await github.rest.git.getRef({
                  ...context.repo, ref: 'tags/' + version
                });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
              if (existing) {
                if (existing.data.object.type !== 'commit' ||
                    existing.data.object.sha !== context.sha) {
                  throw new Error('That tag already identifies another commit. Choose a new version.');
                }
              } else {
                await github.rest.git.createRef({
                  ...context.repo, ref: 'refs/tags/' + version, sha: context.sha
                });
              }
            }
            core.setOutput('release', 'true');
            core.setOutput('version', version);
            core.setOutput('sha', context.sha);
            await core.summary
              .addHeading('Wheelhouse release')
              .addTable([['Version', 'Commit'], [version, context.sha]])
              .addRaw('Deploys the demo, checks it, then deploys the family instances after tests and image builds pass.')
              .write();

  images:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: api
            dockerfile: src/Wheelhouse.Api/Dockerfile
          - name: web
            dockerfile: web/Dockerfile
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/wheelhouse-${{ matrix.name }}:${{ needs.prepare.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: [prepare, images]
    if: needs.prepare.outputs.release == 'true'
    # Playwright cannot install Chromium on the newer image ubuntu-latest moved to; pin until it can.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: read
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.GCP_SSH_KEY }}
          SSH_HOST: ${{ secrets.GCP_HOST }}
          SSH_USER: ${{ secrets.GCP_USER }}
          # The server's host key, pinned so the deploy never talks to a machine posing as it.
          KNOWN_HOSTS: ${{ secrets.GCP_KNOWN_HOSTS }}
        run: |
          if [ -z "$KNOWN_HOSTS" ]; then
            echo "::error::The GCP_KNOWN_HOSTS secret is not set." >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host server
            HostName $SSH_HOST
            User $SSH_USER
            IdentityFile ~/.ssh/id_deploy
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web

      - name: Copy the stack definition
        run: |
          ssh server 'mkdir -p ~/wheelhouse'
          scp deploy/compose.yaml server:wheelhouse/compose.candidate.yaml
          scp deploy/deploy.sh deploy/restore.sh deploy/storage.py deploy/install-maintenance.sh deploy/nightly-backup.sh server:wheelhouse/
          ssh server 'bash ~/wheelhouse/install-maintenance.sh'

      # A demo that fails to start or fails its browser check stops the release here, before any
      # family instance is touched.
      - name: Deploy and check the demo
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash deploy/release-phase.sh Demo

      - name: Deploy and check the family instances
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash deploy/release-phase.sh Family

      - name: Expire old backups and unused Wheelhouse images
        run: ssh server 'python3 ~/wheelhouse/storage.py cleanup'

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-demo-smoke
          path: smoke-results
          if-no-files-found: ignore
          retention-days: 7

  notes:
    needs: [prepare, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Publish release notes
        uses: actions/github-script@v9
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        with:
          script: |
            try {
              await github.rest.repos.getReleaseByTag({ ...context.repo, tag: process.env.VERSION });
              return;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createRelease({
              ...context.repo, tag_name: process.env.VERSION, name: process.env.VERSION, generate_release_notes: true
            });
