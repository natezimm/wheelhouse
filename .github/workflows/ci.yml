name: CI

on:
  pull_request:
  # The release workflow runs these same jobs on each merge to main, and on each release,
  # before it publishes anything, so a broken merge result never ships.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request replaces its older run. A release's test run is never
# cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # The deploy scripts' checks take seconds, so they ride along here rather than paying for
      # a job of their own.
      - name: Deploy scripts
        run: |
          for script in deploy/*.sh; do bash -n "$script"; done
          python3 -m unittest discover -s deploy -p 'test_*.py' -v
          node --check deploy/smoke.mjs
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release
      # The integration tests start PostgreSQL with Testcontainers; the runner's Docker is enough.
      - run: dotnet test --no-build --configuration Release --collect "XPlat Code Coverage" --results-directory "$RUNNER_TEMP/coverage"
      # Fails when line coverage falls under the floor and writes the table to the job summary.
      - name: Coverage floor
        run: python3 scripts/coverage-floor.py "$RUNNER_TEMP"/coverage/*/coverage.cobertura.xml Wheelhouse.Api=0.94

  web:
    # Playwright cannot install Chromium on the newer image ubuntu-latest moved to; pin until it can.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test -- --watch=false
      # The browser download is cached per Playwright version; its system libraries are not.
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: node --test ../deploy/test-smoke.mjs
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: calendar-browser-checks
          path: web/test-results
          retention-days: 7

  # The whole app as `docker compose up` builds it, real API and database included, so a change
  # that breaks the API and web together fails here rather than after a release deploys it.
  stack:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: PostgreSQL major upgrade and rollback
        run: python3 deploy/test-postgres-upgrade.py
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Playwright version
        id: playwright
        working-directory: web
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: web
        run: npx playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: web
        run: npx playwright install-deps chromium
      - name: Start the demo
        run: |
          docker compose up --build -d --wait db
          docker compose up --build -d
          for attempt in $(seq 60); do curl -fsS http://127.0.0.1:8080/health >/dev/null && exit 0; sleep 2; done
          docker compose logs api
          exit 1
      - name: Smoke check the demo
        run: SMOKE_URL=http://127.0.0.1:8080 SMOKE_MODE=Demo node deploy/smoke.mjs
      # Before the other browser checks, so their demo copies and load do not crowd it. Over the
      # budget fails the job; docs/performance-budget.md says what to do.
      - name: Load budget
        run: |
          # The server's nginx forwards over HTTP/1.0, which once lost the app its compression.
          script=$(curl -fsS http://127.0.0.1:8080/ | grep -o 'main-[A-Za-z0-9_-]*\.js' | head -1)
          curl -fsS --http1.0 -H 'Accept-Encoding: gzip' -o /dev/null -D - "http://127.0.0.1:8080/$script" | grep -qi '^content-encoding: gzip' \
            || { echo "$script is sent uncompressed over HTTP/1.0"; exit 1; }
          LOAD_URL=http://127.0.0.1:8080 LOAD_RESULTS=load-results node web/perf/load-budget.mjs
      - name: Edit, drag and series checks against the demo
        working-directory: web
        run: npx playwright test -c playwright.stack.config.mjs
      - name: Smoke check a family instance
        run: |
          # Sign-in needs a Google client to offer; this one is never called.
          export WHEELHOUSE_MODE=Family WHEELHOUSE_GOOGLE_CLIENT_ID=ci-client WHEELHOUSE_GOOGLE_CLIENT_SECRET=ci-secret WHEELHOUSE_PARENT_EMAILS=parent@example.com
          docker compose up -d --force-recreate api web
          for attempt in $(seq 60); do
            curl -fsS http://127.0.0.1:8080/api/session | grep -q '"Family"' && break
            sleep 2
          done
          SMOKE_URL=http://127.0.0.1:8080 SMOKE_MODE=Family SMOKE_INDEX=2 node deploy/smoke.mjs
      - name: Restore drill of the stack's database
        run: |
          # The same layout nightly-backup.sh uploads, made from this stack, then drilled.
          backup="$RUNNER_TEMP/backups/demo"
          mkdir -p "$backup"
          docker tag wheelhouse-api ghcr.io/natezimm/wheelhouse-api:ci
          printf 'WHEELHOUSE_VERSION=ci\nWHEELHOUSE_MODE=Demo\nWHEELHOUSE_DB_PASSWORD=unused\nWHEELHOUSE_HTTP_PORT=8080\n' > "$backup/instance.env"
          cp deploy/compose.yaml "$backup/compose.yaml"
          docker compose exec -T db pg_dump -U wheelhouse -d wheelhouse -Fc --no-owner --no-acl > "$backup/database.dump"
          docker cp "$(docker compose ps -q api):/home/app/.aspnet/DataProtection-Keys/." - > "$backup/keys.tar"
          (cd "$backup" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS && touch COMPLETE)
          tar -cf "$RUNNER_TEMP/backups/drill.tar" -C "$RUNNER_TEMP/backups" demo
          bash deploy/restore-drill.sh "$RUNNER_TEMP/backups/drill.tar"
      - name: API log
        if: failure()
        run: docker compose logs api
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: stack-browser-checks
          path: |
            web/stack-results
            smoke-results
            load-results
          retention-days: 7
