name: CI

on:
  # Pull requests are tested, and main is tested again after each merge, so a broken merge
  # result shows up before a release tag is cut.
  push:
    branches: [main]
  pull_request:
  # The release workflow runs these same jobs before it publishes anything.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request replaces its older run. A release's test run is never
# cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      # The deploy scripts' checks take seconds, so they ride along here rather than paying for
      # a job of their own.
      - name: Deploy scripts
        run: |
          for script in deploy/*.sh; do bash -n "$script"; done
          python3 -m unittest discover -s deploy -p 'test_*.py' -v
          node --check deploy/smoke.mjs
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release
      # The integration tests start PostgreSQL with Testcontainers; the runner's Docker is enough.
      - run: dotnet test --no-build --configuration Release

  web:
    # Playwright cannot install Chromium on the newer image ubuntu-latest moved to; pin until it can.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test -- --watch=false
      # The browser download is cached per Playwright version; its system libraries are not.
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: node --test ../deploy/test-smoke.mjs
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calendar-browser-checks
          path: web/test-results
          retention-days: 7
