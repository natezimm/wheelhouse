name: CI

on:
  # Branches are tested through their pull request, so each change runs once, not twice.
  push:
    branches: [main]
  pull_request:
  # The release workflow runs these same jobs before it publishes anything.
  workflow_call:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release
      # The integration tests start PostgreSQL with Testcontainers; the runner's Docker is enough.
      - run: dotnet test --no-build --configuration Release

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test -- --watch=false
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calendar-browser-checks
          path: web/test-results
          retention-days: 7
