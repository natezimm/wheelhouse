# Dependency updates once a month, one grouped pull request per ecosystem, so they do not
# eat into the monthly Actions minutes.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: monthly
    groups:
      nuget:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: docker
    directories: [/src/Wheelhouse.Api, /web]
    schedule:
      interval: monthly
    groups:
      docker:
        patterns: ["*"]
    # Node's even-numbered releases are the long-term-support ones, and the Dockerfile's version
    # is kept in step with the Node version CI and the web app use. Move it by hand, to the next
    # LTS release, rather than to whatever the newest release is.
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
