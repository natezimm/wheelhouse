<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Wheelhouse</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f1ec">
  <!-- Every instance serves this page, so it names no page address; the preview picture is the
       public demo's, since link previews need an absolute URL. A family instance's robots.txt keeps
       crawlers out (Instance/RobotsEndpoints.cs); these tags are for link previews and the demo. -->
  <meta name="description" content="Wheelhouse is a family calendar for a kitchen wall display and every phone in the house, built on the family's own Google Calendar.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Wheelhouse">
  <meta property="og:title" content="Wheelhouse — the family calendar">
  <meta property="og:description" content="A family calendar for the kitchen wall and every phone, built on Google Calendar.">
  <meta property="og:image" content="https://calendar.nathanzimmerman.com/social-card.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Wheelhouse's week view on a wall display, with each family member's events in their own color.">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="favicon.ico" sizes="48x48">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
