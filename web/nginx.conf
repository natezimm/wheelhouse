# Serves the Angular build and forwards API traffic to the api container.
#
# In production the server's own nginx sits in front and sets X-Forwarded-For and
# X-Forwarded-Proto. They pass through here untouched, so the API sees the real client and scheme.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # On every response, the API's included: no MIME sniffing, no framing by another site, only
    # the origin sent to other sites, and HTTPS from now on (browsers ignore that one over HTTP).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    # Scripts only from this site: angular.json turns off critical-CSS inlining, whose loader is an
    # inline script. Styles may be inline (Angular's component styles and the inlined web fonts).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' ws://$host wss://$host; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Client-side routes such as /wall fall back to the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/(api|health)(/|$) {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
    }

    # SignalR needs the WebSocket upgrade headers passed through.
    location /hubs/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }
}
