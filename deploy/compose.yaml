# Production stack for one Wheelhouse instance, such as the public demo or a family's own.
# Every instance on the server runs this same file from its own folder with its own .env,
# so instances share nothing: separate database, network and secrets. See deploy/README.md.

# Docker keeps a container's output forever by default; this keeps at most 30 MB per container.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:17.11-bookworm
    restart: unless-stopped
    logging: *logging
    # Sized for a small shared VM: the default is 128 MB of buffers, far more than a family's calendar
    # needs; the kernel's file cache still holds what the buffers don't.
    command: ["postgres", "-c", "shared_buffers=32MB"]
    environment:
      POSTGRES_DB: wheelhouse
      POSTGRES_USER: wheelhouse
      POSTGRES_PASSWORD: ${WHEELHOUSE_DB_PASSWORD:?Set WHEELHOUSE_DB_PASSWORD in the instance's .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wheelhouse -d wheelhouse"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: ghcr.io/natezimm/wheelhouse-api:${WHEELHOUSE_VERSION:?deploy.sh sets WHEELHOUSE_VERSION}
    restart: unless-stopped
    logging: *logging
    environment:
      ConnectionStrings__Wheelhouse: Host=db;Port=5432;Database=wheelhouse;Username=wheelhouse;Password=${WHEELHOUSE_DB_PASSWORD};GSS Encryption Mode=Disable
      # Demo gives every visitor a private copy of a fictional family. Family is private: nothing is readable without signing in.
      Wheelhouse__Mode: ${WHEELHOUSE_MODE:?Set WHEELHOUSE_MODE to Demo or Family in the instance's .env}
      # A family instance only: the Google accounts that may sign in as parents, and the OAuth
      # client they sign in through. Without them nobody can sign in. The demo leaves them empty.
      Wheelhouse__ParentEmails: ${WHEELHOUSE_PARENT_EMAILS:-}
      Google__ClientId: ${WHEELHOUSE_GOOGLE_CLIENT_ID:-}
      Google__ClientSecret: ${WHEELHOUSE_GOOGLE_CLIENT_SECRET:-}
      # Workstation GC: the server is small and each instance should stay light.
      DOTNET_gcServer: "0"
    # .NET sizes its heap to the container's limit. Locally a demo API used about 145 MB uncapped and
    # about 87 MB under this limit after 40 visits, answering as fast.
    mem_limit: 160m
    volumes:
      - keys:/home/app/.aspnet/DataProtection-Keys
    depends_on:
      db:
        condition: service_healthy

  web:
    image: ghcr.io/natezimm/wheelhouse-web:${WHEELHOUSE_VERSION}
    restart: unless-stopped
    logging: *logging
    ports:
      # Loopback only. The server's own nginx terminates HTTPS and forwards here.
      - "127.0.0.1:${WHEELHOUSE_HTTP_PORT:?Set WHEELHOUSE_HTTP_PORT in the instance's .env}:80"
    depends_on:
      - api

volumes:
  db-data:
  keys:
