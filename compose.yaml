# Local development stack. Ports bind to loopback only.
#   docker compose up db -d          database for `dotnet run` and `npm start`
#   docker compose up --build -d     the whole app at http://localhost:8080
#   OTEL_EXPORTER_OTLP_ENDPOINT=http://dashboard:18890 docker compose --profile telemetry up --build -d
#                                    the same, with traces, metrics and logs at http://localhost:18888
name: wheelhouse

services:
  db:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: wheelhouse
      POSTGRES_USER: wheelhouse
      POSTGRES_PASSWORD: ${WHEELHOUSE_DB_PASSWORD:-wheelhouse-local-dev}
    ports:
      - "127.0.0.1:${WHEELHOUSE_DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wheelhouse -d wheelhouse"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/Wheelhouse.Api/Dockerfile
    environment:
      ConnectionStrings__Wheelhouse: Host=db;Port=5432;Database=wheelhouse;Username=wheelhouse;Password=${WHEELHOUSE_DB_PASSWORD:-wheelhouse-local-dev};GSS Encryption Mode=Disable
      # Locally the app runs as the demo: your own copy of a fictional family, no sign-in.
      # To try Google sign-in, set WHEELHOUSE_MODE=Family and the three settings below; see the README.
      Wheelhouse__Mode: ${WHEELHOUSE_MODE:-Demo}
      Wheelhouse__ParentEmails: ${WHEELHOUSE_PARENT_EMAILS:-}
      Google__ClientId: ${WHEELHOUSE_GOOGLE_CLIENT_ID:-}
      Google__ClientSecret: ${WHEELHOUSE_GOOGLE_CLIENT_SECRET:-}
      # Empty sends nothing; the telemetry profile's dashboard listens at http://dashboard:18890.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      Telemetry__TraceSampleRatio: "1"
    volumes:
      - keys:/home/app/.aspnet/DataProtection-Keys
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - "127.0.0.1:${WHEELHOUSE_HTTP_PORT:-8080}:80"
    depends_on:
      - api

  # The .NET Aspire dashboard, which keeps traces, metrics and logs in memory (docs/observability.md).
  dashboard:
    profiles: [telemetry]
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13.6.5
    environment:
      ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports:
      - "127.0.0.1:18888:18888"

volumes:
  db-data:
    name: ${WHEELHOUSE_DB_VOLUME:-${COMPOSE_PROJECT_NAME}_db-data}
  keys:
